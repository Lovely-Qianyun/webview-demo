<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>欢迎来到 H5 世界 · WebView Demo</title>
  <meta name="description" content="一个轻量、温暖、响应式的 H5 欢迎页，适配 Android WebView，内置可替换的埋点占位函数。">
  <meta name="theme-color" content="#fdf1e2">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --ink: #2f1c13;
      --ink-soft: #6f5447;
      --ink-muted: #7a5744;
      --accent: #b7410e;
      --focus: #7c2d12;
      --ease: cubic-bezier(.22, .8, .28, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      display: flex;
      padding:
        calc(22px + env(safe-area-inset-top, 0px))
        calc(16px + env(safe-area-inset-right, 0px))
        calc(22px + env(safe-area-inset-bottom, 0px))
        calc(16px + env(safe-area-inset-left, 0px));
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background-color: #fdf2e5;
      background-image:
        radial-gradient(65rem 45rem at 6% -10%, rgba(254, 215, 170, .8) 0%, rgba(254, 215, 170, 0) 60%),
        radial-gradient(55rem 42rem at 105% 8%, rgba(254, 205, 211, .62) 0%, rgba(254, 205, 211, 0) 58%),
        radial-gradient(50rem 36rem at 50% 112%, rgba(253, 230, 138, .42) 0%, rgba(253, 230, 138, 0) 62%),
        linear-gradient(168deg, #fffaf3 0%, #fdf2e5 52%, #f9ebdc 100%);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 背景里缓慢漂浮的两团暖光；不影响布局 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(72px);
      opacity: .45;
    }

    body::before {
      top: -130px;
      left: -90px;
      background: #fdba74;
      animation: drift-a 22s ease-in-out infinite alternate;
    }

    body::after {
      right: -120px;
      bottom: -150px;
      background: #fda4af;
      animation: drift-b 26s ease-in-out infinite alternate;
    }

    [hidden] {
      display: none !important;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      margin: auto;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 26px 22px 24px;
      border: 1px solid rgba(255, 255, 255, .92);
      border-radius: 28px;
      background:
        radial-gradient(110% 80% at 100% 0%, rgba(255, 235, 209, .8) 0%, rgba(255, 250, 244, 0) 56%),
        linear-gradient(180deg, #fffdfa 0%, #fff9f2 100%);
      box-shadow:
        0 30px 65px -34px rgba(109, 46, 15, .42),
        0 10px 24px -20px rgba(109, 46, 15, .24),
        inset 0 1px 0 rgba(255, 255, 255, .95);
      animation: card-in .72s var(--ease) both;
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 7px 11px;
      border: 1px solid #f0d5b9;
      border-radius: 999px;
      background: #fff4e6;
      color: #8a4b26;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .12em;
      line-height: 1.4;
      white-space: nowrap;
    }

    .badge-dot {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e11d48;
      animation: dot-pulse 2.8s ease-out infinite;
    }

    .mark {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(145deg, #fbbf24 0%, #f97316 48%, #e11d48 100%);
      box-shadow:
        0 10px 20px -10px rgba(190, 18, 60, .65),
        inset 0 1px 0 rgba(255, 255, 255, .4);
      transform: rotate(-4deg);
    }

    .mark svg {
      display: block;
    }

    .title {
      margin: 24px 0 0;
      font-size: 34px;
      font-size: clamp(2.1rem, 7.4vw, 2.9rem);
      font-weight: 800;
      letter-spacing: -.025em;
      line-height: 1.18;
      color: var(--ink);
    }

    .title-accent {
      color: var(--accent);
    }

    @supports ((background-clip: text) or (-webkit-background-clip: text)) {
      .title-accent {
        background-image: linear-gradient(96deg, #c2410c 0%, #be123c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    }

    .lead {
      max-width: 32em;
      margin: 14px 0 0;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.75;
      text-wrap: pretty;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .features li {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border: 1px solid #f3ddc5;
      border-radius: 999px;
      background: #fff5ea;
      color: #7c4a2d;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    .features li::before {
      content: "";
      flex: 0 0 auto;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ea580c;
    }

    .bridge-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 14px 0 0;
      padding: 6px 10px;
      border: 1px solid #f0d5b9;
      border-radius: 999px;
      background: #fff7ec;
      color: #7c4a2d;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.4;
    }

    .bridge-dot {
      flex: 0 0 auto;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #a8a29e;
    }

    .bridge-status[data-state="ready"] {
      border-color: #b7efd0;
      background: #f0fdf5;
      color: #166534;
    }

    .bridge-status[data-state="ready"] .bridge-dot {
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, .12);
    }

    .bridge-status[data-state="console"] {
      border-color: #f3ddc5;
      background: #fff5ea;
      color: #7c4a2d;
    }

    .bridge-status[data-state="console"] .bridge-dot {
      background: #f59e0b;
    }

    .cta {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      margin-top: 24px;
      padding: 15px 22px;
      overflow: hidden;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(100deg, #c2410c 0%, #be123c 100%);
      color: #fffaf2;
      font-family: inherit;
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: .02em;
      line-height: 1.2;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        0 18px 30px -16px rgba(190, 18, 60, .55),
        inset 0 1px 0 rgba(255, 255, 255, .24);
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
    }

    .cta-label,
    .cta-arrow {
      position: relative;
      z-index: 1;
    }

    .cta-arrow {
      transition: transform .2s var(--ease);
    }

    .cta:active {
      transform: translateY(1px) scale(.995);
    }

    .cta:focus {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .cta:focus:not(:focus-visible) {
      outline: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .cta:hover {
        transform: translateY(-2px);
        box-shadow:
          0 24px 36px -18px rgba(190, 18, 60, .62),
          inset 0 1px 0 rgba(255, 255, 255, .28);
        filter: saturate(1.04);
      }

      .cta:hover .cta-arrow {
        transform: translateX(3px);
      }
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .32);
      transform: scale(0);
      opacity: .85;
      pointer-events: none;
      animation: ripple .62s ease-out forwards;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--ink-muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .feedback {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 18px;
      padding: 14px 15px;
      border: 1px solid #b7efd0;
      border-radius: 16px;
      background: linear-gradient(180deg, #f2fdf7 0%, #eafbf1 100%);
      color: #14532d;
    }

    .feedback.is-animating {
      animation: feedback-in .42s var(--ease) both;
    }

    .feedback-icon {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #d1fae5;
      color: #047857;
    }

    .feedback-icon svg {
      display: block;
    }

    .feedback-copy {
      min-width: 0;
    }

    .feedback-title {
      margin: 1px 0 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .feedback-text {
      margin: 3px 0 0;
      color: #166534;
      font-size: 12.5px;
      line-height: 1.6;
    }

    .feedback code {
      padding: 1px 5px;
      border-radius: 5px;
      background: rgba(4, 120, 87, .1);
      color: #065f46;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas,
        "Liberation Mono", monospace;
      font-size: 11.5px;
    }

    .page-footer {
      margin-top: 22px;
      color: var(--ink-muted);
      text-align: center;
    }

    .page-footer p {
      margin: 0;
      font-size: 11.5px;
      line-height: 1.7;
    }

    .page-footer .copyright {
      margin-top: 3px;
      font-size: 10.5px;
      letter-spacing: .03em;
    }

    @media (min-width: 640px) {
      body {
        padding-top: 36px;
        padding-bottom: 36px;
      }

      .card {
        padding: 34px 34px 30px;
        border-radius: 30px;
      }

      .title {
        margin-top: 28px;
      }

      .lead {
        font-size: 16px;
      }

      .lead-break {
        display: none;
      }

      .cta {
        min-height: 58px;
        margin-top: 28px;
      }

      .hint {
        font-size: 12.5px;
      }
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.985);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes dot-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(225, 29, 72, .28);
      }
      70% {
        box-shadow: 0 0 0 6px rgba(225, 29, 72, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(225, 29, 72, 0);
      }
    }

    @keyframes drift-a {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(28px, 30px, 0) scale(1.08);
      }
    }

    @keyframes drift-b {
      from {
        transform: translate3d(0, 0, 0) scale(1.04);
      }
      to {
        transform: translate3d(-26px, -24px, 0) scale(1);
      }
    }

    @keyframes feedback-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes ripple {
      to {
        transform: scale(1);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }

      .cta:hover,
      .cta:active {
        transform: none;
      }

      .cta:hover .cta-arrow {
        transform: none;
      }
    }

    @media (forced-colors: active) {
      .title-accent {
        background: none;
        color: CanvasText;
        -webkit-text-fill-color: CanvasText;
      }

      .cta {
        border: 1px solid ButtonText;
      }
    }
  </style>
</head>
<body data-page="welcome">
  <main class="shell">
    <article class="card" data-area="hero">
      <div class="card-top">
        <p class="badge">
          <span class="badge-dot" aria-hidden="true"></span>
          H5 · WEBVIEW DEMO
        </p>
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" focusable="false">
            <path d="M12 3.2 14.1 9.9 20.8 12l-6.7 2.1L12 20.8 9.9 14.1 3.2 12l6.7-2.1L12 3.2Z" fill="#FFF9F1"/>
            <circle cx="19" cy="5.2" r="1.3" fill="#FFF9F1" fill-opacity=".8"/>
          </svg>
        </span>
      </div>

      <h1 class="title">欢迎来到<br><span class="title-accent">H5 世界</span></h1>

      <p class="lead">轻巧、温暖的开始。没有复杂跳转，<br class="lead-break">只有恰到好处的小惊喜。</p>

      <ul class="features" aria-label="页面特点">
        <li>轻量加载</li>
        <li>移动优先</li>
        <li>原生桥接</li>
      </ul>

      <p class="bridge-status" id="bridge-status" data-state="checking" aria-live="polite">
        <span class="bridge-dot" aria-hidden="true"></span>
        <span id="bridge-status-text">正在检测 Android 原生桥…</span>
      </p>

      <button class="cta" id="cta" type="button" data-track="cta_click" data-area="hero-cta" aria-describedby="cta-hint">
        <span class="cta-label">开始体验</span>
        <svg class="cta-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>

      <p class="hint" id="cta-hint">轻点一下，不会跳转；在 WebView 中会通过 Android 原生桥上报。</p>

      <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true" hidden data-area="cta-feedback">
        <span class="feedback-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
        </span>
        <div class="feedback-copy">
          <p class="feedback-title">体验已开启</p>
          <p class="feedback-text">埋点 <code>cta_click</code> 已触发 · 通道 <span id="track-transport">浏览器控制台</span> · 第 <span id="click-count">1</span> 次点击</p>
        </div>
      </div>
    </article>

    <footer class="page-footer" data-area="footer">
      <p>用一点代码，留一点温柔</p>
      <p class="copyright">© 2026 Lovely-Qianyun · webview-demo</p>
    </footer>
  </main>

  <script>
    (function () {
      'use strict';

      var pageName = document.body.getAttribute('data-page') || 'welcome';
      var prefersReducedMotion = false;
      if (window.matchMedia) {
        prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      var bridgeStatusEl = document.getElementById('bridge-status');
      var bridgeStatusTextEl = document.getElementById('bridge-status-text');
      var transportEl = document.getElementById('track-transport');

      function setBridgeState(state, text) {
        if (bridgeStatusEl) {
          bridgeStatusEl.setAttribute('data-state', state);
        }
        if (bridgeStatusTextEl) {
          bridgeStatusTextEl.textContent = text;
        }
      }

      function setTransportLabel(transport) {
        if (!transportEl) {
          return;
        }
        transportEl.textContent = transport === 'android-bridge'
          ? 'Android 原生桥'
          : '浏览器控制台';
      }

      /**
       * H5 埋点入口。
       *
       * WebView 中存在 Android 注入的 window.UmengBridge 时，事件通过
       * UmengBridge.track(eventName, JSON.stringify(params)) 进入友盟 U-App；
       * 普通浏览器中自动回退到 console.debug，方便本地调试。
       */
      function track(eventName, params) {
        var payload = {
          event: eventName,
          page: pageName,
          // U-App 把 ts 当作保留字；使用 h5_ts 保留页面侧时间戳。
          h5_ts: new Date().toISOString()
        };

        if (params) {
          for (var key in params) {
            if (Object.prototype.hasOwnProperty.call(params, key)) {
              payload[key] = params[key];
            }
          }
        }

        var transport = 'console';
        var bridgeError = '';

        if (window.UmengBridge && typeof window.UmengBridge.track === 'function') {
          try {
            var rawResponse = window.UmengBridge.track(eventName, JSON.stringify(payload));
            var bridgeResponse = rawResponse ? JSON.parse(rawResponse) : null;
            if (bridgeResponse && bridgeResponse.ok === true) {
              transport = 'android-bridge';
            } else {
              bridgeError = bridgeResponse && bridgeResponse.error
                ? String(bridgeResponse.error)
                : 'bridge_rejected';
            }
          } catch (error) {
            bridgeError = 'bridge_exception';
          }
        }

        setTransportLabel(transport);
        if (transport === 'android-bridge') {
          setBridgeState('ready', '已连接 Android 原生桥，事件会进入友盟 U-App');
        } else {
          setBridgeState('console', bridgeError
            ? '原生桥调用失败，已回退浏览器控制台'
            : '浏览器环境：只写入控制台，不进入友盟');
        }

        if (window.console && typeof console.debug === 'function') {
          console.debug('[track][' + transport + ']', payload);
          if (bridgeError) {
            console.debug('[track][bridge-error]', bridgeError);
          }
        }

        return transport;
      }

      // 暴露到全局，方便后续实验与调试
      window.track = track;

      // 页面加载埋点
      track('page_view', {
        path: window.location.pathname,
        referrer: document.referrer || 'direct',
        viewport: window.innerWidth + 'x' + window.innerHeight,
        title: document.title
      });

      var cta = document.getElementById('cta');
      var feedback = document.getElementById('feedback');
      var countEl = document.getElementById('click-count');
      var labelEl = cta ? cta.querySelector('.cta-label') : null;
      var clicks = 0;

      if (!cta || !feedback || !countEl) {
        return;
      }

      function addRipple(event) {
        if (prefersReducedMotion) {
          return;
        }

        var rect = cta.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height) * 2;
        var isKeyboard = event.detail === 0;
        var x = isKeyboard ? rect.width / 2 : event.clientX - rect.left;
        var y = isKeyboard ? rect.height / 2 : event.clientY - rect.top;
        var ripple = document.createElement('span');

        ripple.className = 'ripple';
        ripple.setAttribute('aria-hidden', 'true');
        ripple.style.width = size + 'px';
        ripple.style.height = size + 'px';
        ripple.style.left = (x - size / 2) + 'px';
        ripple.style.top = (y - size / 2) + 'px';
        cta.appendChild(ripple);

        window.setTimeout(function () {
          if (ripple.parentNode) {
            ripple.parentNode.removeChild(ripple);
          }
        }, 700);
      }

      cta.addEventListener('click', function (event) {
        clicks += 1;
        countEl.textContent = String(clicks);

        feedback.hidden = false;
        feedback.classList.remove('is-animating');
        // 触发一次重排，让重复点击时也能重播轻量动效
        void feedback.offsetWidth;
        feedback.classList.add('is-animating');

        addRipple(event);

        track(cta.getAttribute('data-track') || 'cta_click', {
          area: cta.getAttribute('data-area') || 'hero',
          label: (labelEl ? labelEl.textContent : cta.textContent).replace(/\s+/g, ' ').trim(),
          click_index: clicks
        });
      }, false);
    }());
  </script>
</body>
</html>
